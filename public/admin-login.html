<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#143e34"><title>دخول إدارة المكتبة</title><link rel="stylesheet" href="/admin.css"></head><body><main class="login-card"><a class="back" href="/">← العودة إلى المكتبة</a><span class="eyebrow">مساحة مستقلة ومحميّة</span><h1>إدارة المكتبة</h1><p>أدخل بيانات حساب المدير الفردي. ويمكن استخدام كلمة مرور الإدارة الأولية إذا لم يُنشأ حساب مدير بعد.</p><button type="button" id="googleLogin" data-destination="admin" disabled>الدخول بحساب Google</button><p id="googleHint">جارٍ التحقق من توفر دخول Google…</p><form id="adminLogin"><label for="email">البريد الإلكتروني لحساب المدير (اتركه فارغاً للدخول الأولي)</label><input id="email" type="email" autocomplete="username" autofocus><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button class="primary">دخول الإدارة</button><p id="message" role="status" aria-live="polite"></p></form></main><script src="/admin-login.js" defer></script><script src="/google-login.js" defer></script></body></html>
