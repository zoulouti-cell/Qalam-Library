<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123f35"><title>دخول المكتبة القانونية</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f1e8;color:#14231e;font-family:Arial,sans-serif}.card{width:min(420px,calc(100% - 36px));padding:30px;border:1px solid #d8cba7;border-radius:22px;background:#fffdf7;box-shadow:0 20px 60px #102c2418}h1{font-size:24px;margin:0 0 8px;color:#123f35}p{color:#66716a;line-height:1.8}label{display:block;margin:20px 0 8px;font-weight:bold}input{box-sizing:border-box;width:100%;padding:14px;border:1px solid #c9c4b4;border-radius:10px;font-size:17px}button{margin-top:16px;width:100%;padding:13px;border:0;border-radius:10px;background:#123f35;color:#f3d77d;font-size:17px;font-weight:bold;cursor:pointer}#message{min-height:25px;color:#a13c2c}</style></head><body><main class="card"><h1>المكتبة القانونية المغربية</h1><p>أدخل كلمة المرور للوصول إلى المكتبة.</p><form id="login"><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required autofocus><button>دخول</button><p id="message" role="status"></p></form></main><script src="/login.js" defer></script></body></html>
