<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#143e34"><link rel="icon" href="/assets/qaf-favicon.svg"><link rel="stylesheet" href="/admin.css"><title>حسابي — المكتبة الرقمية</title></head><body>
<header class="top"><a class="brand" href="/"><img class="brand-seal" src="/assets/qalam-qaf-seal.png" alt=""><strong>المكتبة الرقمية</strong></a><nav><a href="/">العودة للمكتبة</a><button id="logout" type="button">تسجيل الخروج</button></nav></header>
<main class="wrap account-wrap"><section class="hero"><div><span class="eyebrow">حساب القارئ</span><h1>حسابي</h1><p>بيانات الدخول وإعدادات الحساب الخاصة بك.</p></div></section>
<section class="panel"><h2>بيانات الحساب</h2><div class="account-grid"><div><small>البريد الإلكتروني</small><strong id="accountEmail" dir="ltr">جارٍ التحميل…</strong></div><div><small>الصلاحية</small><strong id="accountRole">—</strong></div><div><small>تاريخ التسجيل</small><strong id="accountCreated">—</strong></div><div><small>آخر دخول</small><strong id="accountLastLogin">—</strong></div><div><small>الدخول بواسطة Google</small><strong id="accountGoogle">—</strong></div></div><p id="accountNote" class="muted"></p></section>
<section class="panel" id="passwordPanel" hidden><h2>تغيير كلمة المرور</h2><form id="passwordForm" class="account-password-form"><label>كلمة المرور الحالية<span class="password-field"><input id="currentPassword" type="password" autocomplete="current-password" required><button type="button" data-password-toggle="currentPassword" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button></span></label><label>كلمة المرور الجديدة<span class="password-field"><input id="newPassword" type="password" autocomplete="new-password" minlength="12" required><button type="button" data-password-toggle="newPassword" aria-label="إظهار كلمة المرور" aria-pressed="false">إظهار</button></span></label><button class="primary" type="submit">حفظ كلمة المرور</button><p id="passwordStatus" role="status" aria-live="polite"></p></form></section>
</main><script src="/password-toggle.js" defer></script><script src="/account.js" defer></script></body></html>
