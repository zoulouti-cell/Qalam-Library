name: Library build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check JavaScript syntax
        run: |
          node --check server.mjs
          for file in src/*.mjs; do node --check "$file"; done
          node --check public/app.js
          node --check public/admin-ocr.js
      - name: Build the production container
        run: docker build --tag qalam-library-ci .
