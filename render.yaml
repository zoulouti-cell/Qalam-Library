services:
  - type: web
    name: qalam-library
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LIBRARY_ACCESS_PASSWORD
        sync: false
      - key: LIBRARY_ADMIN_PASSWORD
        sync: false
      - key: LIBRARY_SESSION_SECRET
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: DRIVE_ROOT_FOLDER_ID
        value: 1-Bcn4VPhTjoW-z6ZERbd_mGMEy1KZ1-K
